name: pos
description: "Ceylonic POS - Point of Sale Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  get_storage: ^2.1.1
  dio: ^5.10.0
  device_preview: ^3.0.0
  logger: ^2.5.0
  flutter_screenutil: ^5.9.3
  infinite_scroll_pagination: ^4.1.0
  flutter_dotenv: ^6.0.1
  animated_custom_dropdown: ^4.0.0
  iconsax: ^0.0.8
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  timeago: ^3.7.1 
  expansion_tile_list: ^2.0.0
  permission_handler: ^13.0.2
  google_fonts: ^8.0.0
  file_picker: ^13.1.0
  signature: ^6.3.0
  flutter_slidable: ^4.0.3
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  qr_flutter: ^4.1.0
  package_info_plus: ^10.2.2
  smooth_page_indicator: ^1.2.1
  connectivity_plus: ^6.1.4
  lottie: ^3.3.1
  flutter_spinkit: ^5.2.2
  mobile_scanner: ^5.2.3
  in_app_update: ^5.0.0
  flutter_markdown: ^0.7.7+1
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  pdfrx: ^2.6.5
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/json/countries.json
    - assets/appstore.png
    - assets/playstore.png
    - assets/lottie/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/appstore.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/appstore.png"
  remove_alpha_ios: true
